version: '3'

services:
  local-postgres-compose:
    image: postgres
    env_file:
      - variables.env
    ports:
      - "5433:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./postgres-data:/var/lib/postgres/data
    networks:
      - postgres-compose-network

networks:
  postgres-compose-network:
    driver: bridge